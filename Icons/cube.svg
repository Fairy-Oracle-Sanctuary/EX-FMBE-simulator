<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="2.9" stroke-linejoin="round" stroke-linecap="round">
  <!-- 勾线方块（等轴测投影），仅作遮罩使用：颜色由 .hmb-icon::after 的 background-color 决定（深色主题白、浅色主题黑）。
       沿 (1,1,1) 方向观察立方体，外轮廓恰好是一个正六边形：上下为尖角（90°/270° 顶点），
       左右四个顶点在 30°/150°/210°/330°。六边形外接圆半径 7.55 → 菱形高/宽 = 0.577（真等轴测，非压扁的 0.5）。
       内部三条可见棱交于六边形中心 —— 即离视点最近的那个顶点，构成「Y」形（两臂朝上、主枝朝下），
       把六边形分成顶面 + 左上/右下两个侧面的三个菱形。 -->
