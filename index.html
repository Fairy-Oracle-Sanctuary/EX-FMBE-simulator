function applyNewLayoutMode() {
    const body = document.body;
    const newTopBar = document.getElementById('newTopBar');
    const sideList = document.getElementById('sideBlockList');
    const dataPanel = document.getElementById('dataPanel');
    
    if (isNewLayoutMode) {
        body.classList.add('new-layout-active');
        if (newTopBar) newTopBar.style.display = 'flex';
        if (sideList) {
            sideList.style.display = 'block';
            // 根据侧边面板模式决定方块列表位置
            if (isSidePanelMode) {
                sideList.classList.remove('side-list-bottom');
            } else {
                sideList.classList.add('side-list-bottom');
            }
            applySideListDimensions();
        }
        renderSideBlockList();
        // 新操作模式时显示世界轴位移和枢轴联动设置
        const worldAxisDispSetting = document.getElementById('worldAxisDispSetting');
        if (worldAxisDispSetting) worldAxisDispSetting.style.display = 'flex';
        const pivotLinkSetting = document.getElementById('pivotLinkSetting');
        if (pivotLinkSetting) pivotLinkSetting.style.display = 'flex';
    } else {
        body.classList.remove('new-layout-active');
        if (newTopBar) newTopBar.style.display = 'none';
        if (sideList) {
            sideList.style.display = 'none';
            sideList.classList.remove('side-list-bottom');
        }
        // 退出关键帧模式
        if (isKeyframeMode) {
            isKeyframeMode = false;
            if (keyframeWindowOpen && keyframeWindowEl) {
                stopKeyframePlayback();
                keyframeWindowEl.style.display = 'none';
                keyframeWindowOpen = false;
            }
        }
        // 恢复数据面板显示（移除内联 style）
        if (dataPanel) dataPanel.style.display = '';
        // 非新操作模式时隐藏世界轴位移和枢轴联动设置
        const worldAxisDispSetting = document.getElementById('worldAxisDispSetting');
        if (worldAxisDispSetting) worldAxisDispSetting.style.display = 'none';
        const pivotLinkSetting = document.getElementById('pivotLinkSetting');
        if (pivotLinkSetting) pivotLinkSetting.style.display = 'none';
    }
    // 关闭所有下拉菜单
    closeAllTopDropdowns();
    if (uiSettingsPanel) uiSettingsPanel.style.display = 'none';
}

function renderSideBlockList() {
    const sideList = document.getElementById('sideBlockList');
    if (!sideList) return;
    
    const isKfMode = isNewLayoutMode && isKeyframeMode;
    
    const kfReady = _kfSystemReady;
    
    // 关键帧模式：显示已加入关键帧系统的方块；普通模式：过滤掉已加入关键帧系统的方块
    const displayBlocks = isKfMode
        ? blocks.filter(b => kfReady && keyframeData.has(b.id))
        : isNewLayoutMode
            ? blocks.filter(b => !kfReady || !keyframeData.has(b.id))
            : blocks;
    
    let html = `<div class="side-block-list-title">📦 方块列表</div>`;
    
    // 关键帧动画入口（关键帧模式下高亮）
    const kfActiveStyle = isKfMode
        ? 'border-bottom:2px solid #a855f7;margin-bottom:4px;padding-bottom:8px;color:#a855f7;background:rgba(168,85,247,0.1);border-radius:6px;'
        : 'border-bottom:1px solid rgba(59,130,246,0.3);margin-bottom:4px;padding-bottom:8px;color:#facc15;';

            const block = blocks.find(b => b.id === bid);
            if (block) {
                if (isKfMode) {

                    const isMulti = e.ctrlKey || e.metaKey || e.shiftKey;
                    if (isMulti) {
                        toggleBlockSelection(block, true);
                    } else {
                        selectedBlocksSet.clear();
                        selectedBlocksSet.add(block);
                        selectBlock(block);
                    }
                    // 在关键帧编辑器中选中该方块
                    if (!keyframeData.has(block.id)) {
                        initKeyframeForBlock(block.id);
                        addKeyframeBlockTag(block.id);
                    }
                    selectKeyframeBlock(block.id, isMulti);
                    if (!keyframeWindowOpen) {
                        openKeyframeWindow();
                    } else if (keyframeWindowEl) {
                        keyframeWindowEl.style.display = 'block';
                    }
                    renderSideBlockList();
                } else {
                    const isMulti = e.ctrlKey || e.metaKey || e.shiftKey;
                    toggleBlockSelection(block, isMulti);
                    renderSideBlockList();
                }
            }
        });
    });
    
    if (!isKfMode) {
        sideList.querySelectorAll('.side-block-copy').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const bid = btn.dataset.id;
                const block = blocks.find(b => b.id === bid);
                if (block) {
                    duplicateBlock(block);
                    renderSideBlockList();
                }
            });
        });
    }
    
    sideList.querySelectorAll('.side-block-delete').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const bid = btn.dataset.id;
            const block = blocks.find(b => b.id === bid);
            if (block) {
                removeBlock(block);
                renderSideBlockList();
                if (selectedBlock) renderVariablesForBlock(selectedBlock);
            }
        });
    });
    
    if (!isKfMode) {
        const allBtn = document.getElementById('sideBlockAll');
        if (allBtn) {
            allBtn.addEventListener('click', () => {
                selectedBlocksSet.clear();
                displayBlocks.forEach(b => selectedBlocksSet.add(b));
                if (selectedBlock) {
                    selectedBlock.axisHelper.visible = false;
                    selectedBlock = null;
                }
                updateAxesVisibility();
                renderVariablesForBlock(null);
                blocks.forEach(b => b.updateSelectionHighlight(selectedBlocksSet.has(b)));
                renderSideBlockList();
            });
        }
        
        // 新建模型按钮
        const newBtn = document.getElementById('sideBlockNew');
        if (newBtn) {
            newBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                showCreateBlockMenu();
            });
        }
        
        // 骨骼绑定按钮
        const boneBtn = document.getElementById('sideBlockBone');
        if (boneBtn) {
            boneBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const target = selectedBlocksSet.size ? [...selectedBlocksSet][0] : selectedBlock;
                if (!target || blocks.length < 2) {
                    showModal("提示", "请先选中一个方块，并确保有两个以上方块才能绑定", null, false);

                }
                showParentSelector(target);
            });
        }
    }
    
    // 关键帧动画按钮
    const kfBtnSide = document.getElementById('sideBlockKeyframe');
    if (kfBtnSide) {
        kfBtnSide.addEventListener('click', (e) => {

                if (isKeyframeMode) {
                    exitKeyframeMode();

                    enterKeyframeMode();

// ========== 方块列表边缘拖拽调整大小 ==========
let sideListWidth = parseInt(localStorage.getItem('ui_side_list_width') || '200', 10);
let sideListHeight = parseInt(localStorage.getItem('ui_side_list_height') || '160', 10);
let isResizingSideList = false;
let resizeStartClient = 0;
let resizeStartDim = 0;

function setupSideListResize() {
    const sideList = document.getElementById('sideBlockList');
    if (!sideList) return;

    sideList.addEventListener('pointerdown', (e) => {
        const rect = sideList.getBoundingClientRect();
        const edgeSize = 10;

        if (isSidePanelMode) {
            // 侧边模式：点击左侧边缘
            if (e.clientX >= rect.left && e.clientX <= rect.left + edgeSize) {
                e.preventDefault();
                isResizingSideList = true;
                resizeStartClient = e.clientX;
                resizeStartDim = sideListWidth;
                document.body.style.userSelect = 'none';
                document.body.style.cursor = 'ew-resize';
                document.addEventListener('pointermove', onSideListResizeMove);
                document.addEventListener('pointerup', onSideListResizeUp);
            }
        } else {
            // 底部模式：点击上边缘
            if (e.clientY >= rect.top && e.clientY <= rect.top + edgeSize) {
                e.preventDefault();
                isResizingSideList = true;
                resizeStartClient = e.clientY;
                resizeStartDim = sideListHeight;
                document.body.style.userSelect = 'none';
                document.body.style.cursor = 'ns-resize';
                document.addEventListener('pointermove', onSideListResizeMove);
                document.addEventListener('pointerup', onSideListResizeUp);
            }
        }
    });

    // 鼠标悬停时显示光标样式
    sideList.addEventListener('pointermove', (e) => {
        if (isResizingSideList) return;
        const rect = sideList.getBoundingClientRect();
        const edgeSize = 10;
        if (isSidePanelMode && e.clientX >= rect.left && e.clientX <= rect.left + edgeSize) {
            sideList.style.cursor = 'ew-resize';
        } else if (!isSidePanelMode && e.clientY >= rect.top && e.clientY <= rect.top + edgeSize) {
            sideList.style.cursor = 'ns-resize';
        } else {
            sideList.style.cursor = '';
        }
    });
}

function onSideListResizeMove(e) {
    if (!isResizingSideList) return;
    const sideList = document.getElementById('sideBlockList');
    if (!sideList) return;
    if (isSidePanelMode) {
        let newWidth = resizeStartDim + (resizeStartClient - e.clientX);
        newWidth = Math.max(100, Math.min(500, newWidth));
        sideListWidth = newWidth;
        sideList.style.width = newWidth + 'px';
        try { localStorage.setItem('ui_side_list_width', String(newWidth)); } catch (err) {}
    } else {
        let newHeight = resizeStartDim + (resizeStartClient - e.clientY);
        newHeight = Math.max(80, Math.min(400, newHeight));
        sideListHeight = newHeight;
        sideList.style.height = newHeight + 'px';
        try { localStorage.setItem('ui_side_list_height', String(newHeight)); } catch (err) {}
    }
}

function onSideListResizeUp() {
    isResizingSideList = false;
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
    document.removeEventListener('pointermove', onSideListResizeMove);
    document.removeEventListener('pointerup', onSideListResizeUp);
}

function applySideListDimensions() {
    const sideList = document.getElementById('sideBlockList');
    if (!sideList) return;
    if (isSidePanelMode) {
        sideList.style.width = sideListWidth + 'px';
        sideList.style.height = '';
    } else {
        sideList.style.height = sideListHeight + 'px';
        sideList.style.width = '';
    }
}

// ========== 顶部下拉菜单 ==========
let activeTopDropdown = null;

function closeAllTopDropdowns() {
    document.querySelectorAll('.top-dropdown-menu.open').forEach(m => m.classList.remove('open'));
    activeTopDropdown = null;
}

function toggleTopDropdown(dropdownId) {
    const menu = document.getElementById(dropdownId);
    if (!menu) return;
    const isOpen = menu.classList.contains('open');
    closeAllTopDropdowns();
    if (!isOpen) {
        menu.classList.add('open');
        activeTopDropdown = dropdownId;
        // 定位下拉菜单
        const btn = menu.closest('.top-dropdown-wrapper')?.querySelector('.top-menu-btn, .her-mode-btn');
        if (btn) {
            const rect = btn.getBoundingClientRect();
            menu.style.left = rect.left + 'px';
            menu.style.top = (rect.bottom + 4) + 'px';
        }
        // 如果是视图菜单，更新勾选状态
        if (dropdownId === 'viewDropdown') {
            const axesChk = document.getElementById('showAxesCheckbox');
            const gridChk = document.getElementById('showGridCheckbox');
            const ticksChk = document.getElementById('showTicksCheckbox');
            const items = {
                'showAxes': axesChk?.checked,
                'showGrid': gridChk?.checked,
                'showTicks': ticksChk?.checked
            };
            menu.querySelectorAll('.top-dropdown-item[data-view-action]').forEach(item => {
                const action = item.dataset.viewAction;
                const span = item.querySelector('span');
                if (action in items && span) {
                    const checked = items[action];
                    if (checked !== undefined) {
                        span.textContent = checked ? `✓ ${item.dataset.viewAction === 'showAxes' ? '显示轴线' : item.dataset.viewAction === 'showGrid' ? '显示平面' : '显示刻度'}` : 
                            (item.dataset.viewAction === 'showAxes' ? '显示轴线' : item.dataset.viewAction === 'showGrid' ? '显示平面' : '显示刻度');
                    }
                }
                // 隐藏按钮状态
                if (action === 'hideNames' && span) {
                    span.textContent = hideNames ? '显示' : '隐藏';
                }
            });
        }
    }
}

function toggleUISettingsPanel(e) {
    if (e) e.stopPropagation();
    if (!uiSettingsPanel) return;
    const show = uiSettingsPanel.style.display !== 'block';
    uiSettingsPanel.style.display = show ? 'block' : 'none';
    if (show) {
        // 确保面板脱离可能造成 stacking context 的父容器
        try {
            if (uiSettingsPanel.parentElement !== document.body) document.body.appendChild(uiSettingsPanel);
        } catch (err) { /* ignore */ }
        positionUISettingsPanel();
    }
}
window.toggleUISettingsPanel = toggleUISettingsPanel;

function positionUISettingsPanel() {
    const panel = document.getElementById('uiSettingsPanel');
    const btn = document.getElementById('uiSettingsBtn');
    if (!panel || !btn) return;
    const rect = btn.getBoundingClientRect();
    const gap = 8;
    panel.style.position = 'fixed';
    panel.style.zIndex = 9999;
    panel.style.pointerEvents = 'auto';
    panel.style.maxWidth = '320px';
    if (isNewLayoutMode) {
        // 新布局模式：设置面板从操作按钮位置弹出
        const actionBtn = document.getElementById('actionMenuBtn');
        if (actionBtn) {
            const aRect = actionBtn.getBoundingClientRect();
            panel.style.left = `${Math.max(8, aRect.left)}px`;
            panel.style.top = `${aRect.bottom + gap}px`;
        } else {
            panel.style.left = '16px';
            panel.style.top = '56px';
        }
        panel.style.right = 'auto';
        panel.style.bottom = 'auto';
        panel.style.transform = 'none';
        panel.style.width = '300px';
    } else if (isSidePanelMode) {
        const panelWidth = panel.offsetWidth || 320;
        const left = Math.max(8, rect.left - panelWidth - gap);
        panel.style.left = `${left}px`;
        panel.style.top = `${Math.max(8, rect.top)}px`;
        panel.style.right = 'auto';
        panel.style.bottom = 'auto';
        panel.style.transform = 'none';
    } else {
        panel.style.left = '50%';
        panel.style.transform = 'translateX(-50%) skewX(-5deg)';
        panel.style.bottom = `${Math.max(8, window.innerHeight - rect.bottom + gap)}px`;
        panel.style.top = 'auto';
        panel.style.right = 'auto';
    }
}

window.addEventListener('resize', () => { positionUISettingsPanel(); });

function ensureOverlays() {
    const container = document.getElementById('canvas-container');
    if (container) {
        let cbg = document.getElementById('canvasBgOverlay');
        if (!cbg) {
            cbg = document.createElement('div');
            cbg.id = 'canvasBgOverlay';
            document.body.insertBefore(cbg, container);
            cbg.style.position = 'fixed';
            cbg.style.left = '0';
            cbg.style.top = '0';
            cbg.style.right = '0';
            cbg.style.bottom = '0';
            cbg.style.pointerEvents = 'none';
            cbg.style.zIndex = '0';
            cbg.style.backgroundRepeat = 'no-repeat';
            cbg.style.backgroundSize = 'cover';
            cbg.style.backgroundPosition = 'center';
            cbg.style.backgroundImage = document.body.style.backgroundImage || '';
            cbg.style.backgroundColor = document.body.style.backgroundColor || '#030617';
            cbg.style.opacity = isLightMode ? '1' : '0';
        }
    }
    // toolbar overlays
    ['.toolbar-integrated', '.top-bar'].forEach(sel => {
        document.querySelectorAll(sel).forEach(el => {
            if (!el.querySelector('.toolbar-bg-overlay')) {
                const ov = document.createElement('div');
                ov.className = 'toolbar-bg-overlay';
                ov.style.position = 'absolute';
                ov.style.left = '0';
                ov.style.top = '0';
                ov.style.right = '0';
                ov.style.bottom = '0';
                ov.style.pointerEvents = 'none';
                ov.style.zIndex = '0';
                ov.style.background = window.getComputedStyle(el).background || '';
                ov.style.backgroundSize = 'cover';
                ov.style.backgroundPosition = 'center';
                ov.style.opacity = isLightMode ? '1' : '0';
                el.insertBefore(ov, el.firstChild);
                el.style.position = el.style.position || 'relative';
            }
        });
    });
}
ensureOverlays();

function setGrayscale(percent) {
    const p = Math.max(0, Math.min(100, Number(percent)||0));
    ensureOverlays();
    const canvasBg = document.getElementById('canvasBgOverlay');
    const dataPanel = document.getElementById('dataPanel');

    // 深色模式：滑块保持可见但禁用（显示为黑色圆点），灰度不生效
    if (!isLightMode) {
        if (grayscaleRange) { grayscaleRange.disabled = true; grayscaleRange.classList.add('grayscale-disabled'); }
        if (canvasBg) canvasBg.style.filter = '';
        if (dataPanel) {
            const bg = document.getElementById('dataPanelBgOverlay'); if (bg) bg.style.background = '';
        }
        document.documentElement.style.setProperty('--modal-bg-grayscale', '#162136');
        if (grayscaleLabel) {
            const saved = parseInt(localStorage.getItem('ui_grayscale') || '0', 10);
            grayscaleLabel.textContent = (isNaN(saved) ? 0 : saved) + '%';
        }
        return;
    }

    // 浅色模式：启用滑块
    if (grayscaleRange) { grayscaleRange.disabled = false; grayscaleRange.classList.remove('grayscale-disabled'); }

    // Canvas 背景 overlay 应用灰度（不影响 WebGL canvas 内对象）
    if (canvasBg) canvasBg.style.filter = p ? `grayscale(${p}%)` : '';

    // data panel 背景覆盖强度
    if (dataPanel) {
        let bg = document.getElementById('dataPanelBgOverlay');
        if (!bg) {
            bg = document.createElement('div'); bg.id = 'dataPanelBgOverlay'; bg.style.position = 'absolute'; bg.style.left = '0'; bg.style.top = '0'; bg.style.right = '0'; bg.style.bottom = '0'; bg.style.pointerEvents = 'none'; bg.style.zIndex = '0'; dataPanel.style.position = dataPanel.style.position || 'fixed'; dataPanel.insertBefore(bg, dataPanel.firstChild); const content = dataPanel.querySelector('.panel-content'); if (content) content.style.position = 'relative';
        }
        const alpha = (p/100) * 0.8;
        bg.style.background = `rgba(128,128,128,${alpha})`;
        bg.style.opacity = p > 0 ? '1' : '0';
    }

    // 弹窗灰度：限制为最多 20%
    const pModal = Math.min(p, 20);
    const grayRgb = 220 - Math.round((pModal/100) * 180);
    document.documentElement.style.setProperty('--modal-bg-grayscale', `rgba(${grayRgb},${grayRgb},${grayRgb},0.92)`);

    // 工具栏背景 overlay（允许最高 100%）
    document.querySelectorAll('.toolbar-integrated, .top-bar').forEach(el => {
        const ov = el.querySelector('.toolbar-bg-overlay');
        if (ov) ov.style.filter = p ? `grayscale(${p}%)` : '';
    });

    if (grayscaleLabel) grayscaleLabel.textContent = p + '%';
    try { localStorage.setItem('ui_grayscale', String(p)); } catch (e) {}
}

// 初始化值
try {

// ============================================================
// 3D Gizmo 变换控件 —— 完整实现（基于 Three.js）
// 包含：平移箭头、旋转弧、缩放点、拾取、拖拽、同步更新
// ============================================================

// ---------- 配置常量 ----------
const HER_DEFAULT_COLORS = { x: 0xff4444, y: 0x44ff44, z: 0x4488ff };

// ---------- 全局状态 ----------
const herModes = new Set();            // 当前激活的模式：'origin', 'base', 'rotate', 'centerRotate', 'scale'
let gizmoRoot = null;                 // 在 scene 初始化后创建并添加到场景
let pickables = [];                   // 所有可拾取对象（隐藏命中体）
let activePick = null;                // 当前拖拽的控件元数据
let pendingInputPick = null;          // 数值标签短按待弹窗
let activeHighlight = null;           // 高亮发光体
let lastPX = 0, lastPY = 0;           // 上一帧鼠标位置
let gizmoArrowGroups = [];            // 箭头组（用于自适应缩放）
let originCenterLineObj = null;       // 原点→几何中心连线
let rotArcGroups = [];                // 旋转弧组
let gizmoAxisLines = [];              // XYZ轴向指示线
let draggingGizmo = false;            // 是否正在拖拽
let dragNeedsRebuild = false;
let lastDragRebuild = 0;
let lastGizmoSig = '', gizmoDirty = true, lastGizmoCheck = 0;
let activeGizmoPointerId = null;
let activeGizmoTouchId = null;
let lastTouchGizmoAt = 0;
let lastPromptAt = 0;

// ---------- 辅助函数（依赖外部状态） ----------
function selected() {
    return selectedBlocksSet.size ? [...selectedBlocksSet][0] : selectedBlock;
}

function originOfBlock(b) {
    const M = b.scope.toM();
    return new THREE.Vector3(M[0], M[1], M[2]);
}

function centerOfBlock(b) {
    const M = b.scope.toM();
    const rX = b.scope.vars.get('v.rotatex')?.value ?? 0;
    const rY = b.scope.vars.get('v.rotatey')?.value ?? 0;
    const rZ = b.scope.vars.get('v.rotatez')?.value ?? 0;
    const mat = computeTransformMatrix(M, rX, rY, rZ);
    return new THREE.Vector3().setFromMatrixPosition(mat);
}

function quatOfBlock(b) {
    const q = new THREE.Quaternion();
    if (b && b.mesh) {
        b.mesh.updateMatrixWorld(true);
        b.mesh.getWorldQuaternion(q);
    }
    return q;
}

// 计算包含剪切变换（extend_xrot / extend_yrot）的方块局部轴在世界空间的方向
// 返回值始终保证线性部分行列式为正（去除镜像翻转），与 quatOfBlock 一致
function shearedAxesOfBlock(b) {
    const M = b.scope.toM();
    const rX = b.scope.vars.get('v.rotatex')?.value ?? 0;
    const rY = b.scope.vars.get('v.rotatey')?.value ?? 0;
    const rZ = b.scope.vars.get('v.rotatez')?.value ?? 0;
    const worldMat = computeTransformMatrix(M, rX, rY, rZ);
    const origin = new THREE.Vector3().setFromMatrixPosition(worldMat);
    const sx = new THREE.Vector3(1,0,0).applyMatrix4(worldMat).sub(origin);
    const sy = new THREE.Vector3(0,1,0).applyMatrix4(worldMat).sub(origin);
    const sz = new THREE.Vector3(0,0,1).applyMatrix4(worldMat).sub(origin);
    // 若线性部分行列式为负（镜像/负scale），取反所有轴以匹配 quatOfBlock 的朝向
    if (worldMat.determinant() < 0) {
        sx.negate(); sy.negate(); sz.negate();
    }
    return {
        x: sx.normalize(),
        y: sy.normalize(),
        z: sz.normalize()
    };
}

function varValue(name) {
    const b = selected();
    const v = b?.scope?.vars?.get(name)?.value;
    return Number.isFinite(Number(v)) ? Number(v) : 0;
}

function normRotDeg(v) {
    v = ((v + 180) % 360 + 360) % 360 - 180;
    return v === -180 ? 180 : v;
}

// ---------- 材质工厂 ----------
function mat(color, opacity = 0.98) {
    return new THREE.MeshBasicMaterial({
        color, depthTest: false, depthWrite: false,
        transparent: true, opacity, side: THREE.DoubleSide
    });
}

function hitMat() {
    return new THREE.MeshBasicMaterial({
        color: 0xffffff, depthTest: false, depthWrite: false,
        transparent: true, opacity: 0.001, side: THREE.DoubleSide
    });
}

// ---------- 拾取对象注册 ----------
function addPick(obj, meta) {
    obj.userData.her = meta;
    obj.userData.herPriority = meta.priority || 0;
    pickables.push(obj);
}

// ---------- 几何体工厂 ----------
function makeArrowShape(len = 2.15, width = 0.18, head = 0.55) {
    const sh = new THREE.Shape();
    const body = len - head;
    const half = width * 0.5;
    const headHalf = width * 0.95;
    sh.moveTo(0, -half);
    sh.lineTo(body, -half);
    sh.lineTo(body, -headHalf);
    sh.lineTo(len, 0);
    sh.lineTo(body, headHalf);
    sh.lineTo(body, half);
    sh.lineTo(0, half);
    sh.lineTo(0, -half);
    return new THREE.ShapeGeometry(sh);
}

function makeArcBandShape(radius = 2.05, thickness = 0.05, start = 0, end = Math.PI) {
    const sh = new THREE.Shape();
    const steps = 40;
    const pts = [];
    for (let i = 0; i <= steps; i++) {
        const a = start + (end - start) * i / steps;
        pts.push([Math.cos(a) * (radius + thickness), Math.sin(a) * (radius + thickness)]);
    }
    for (let i = steps; i >= 0; i--) {
        const a = start + (end - start) * i / steps;
        pts.push([Math.cos(a) * (radius - thickness), Math.sin(a) * (radius - thickness)]);
    }
    sh.moveTo(pts[0][0], pts[0][1]);
    pts.slice(1).forEach(p => sh.lineTo(p[0], p[1]));
    sh.closePath();
    return new THREE.ShapeGeometry(sh);
}

function makeDiamondShape(d = 0.22) {
    const sh = new THREE.Shape();
    sh.moveTo(-d, 0);
    sh.lineTo(0, d);
    sh.lineTo(d, 0);
    sh.lineTo(0, -d);
    sh.closePath();
    return new THREE.ShapeGeometry(sh);
}

function makeArcHeadShape(size = 0.58) {
    const sh = new THREE.Shape();
    sh.moveTo(size, 0);
    sh.lineTo(-size * 0.45, size * 0.58);
    sh.lineTo(-size * 0.18, 0);
    sh.lineTo(-size * 0.45, -size * 0.58);
    sh.lineTo(size, 0);
    return new THREE.ShapeGeometry(sh);
}

// ---------- 朝向工具 ----------
function orientFlat(obj, dir, normal) {
    const x = dir.clone().normalize();
    let z = normal.clone().normalize();
    if (Math.abs(x.dot(z)) > 0.95) {
        z = camera.position.clone().sub(gizmoRoot.position).normalize();
    }
    const y = new THREE.Vector3().crossVectors(z, x).normalize();
    z = new THREE.Vector3().crossVectors(x, y).normalize();
    obj.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
}

function orientCylinderAlong(obj, dir) {
    obj.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
}

function orthonormalDiscBasis(axisNormal, preferredX) {
    const z = axisNormal.clone().normalize();
    let x = preferredX.clone().addScaledVector(z, -preferredX.dot(z));
    if (x.lengthSq() < 1e-5) {
        x = new THREE.Vector3(1, 0, 0).addScaledVector(z, -new THREE.Vector3(1, 0, 0).dot(z));
    }
    if (x.lengthSq() < 1e-5) {
        x = new THREE.Vector3(0, 1, 0).addScaledVector(z, -new THREE.Vector3(0, 1, 0).dot(z));
    }
    x.normalize();
    const y = new THREE.Vector3().crossVectors(z, x).normalize();
    return { x, y, z };
}

function orientDiscToBasis(group, xBasis, yBasis, axisNormal) {
    const d = orthonormalDiscBasis(axisNormal.clone().normalize(), xBasis.clone().normalize());
    group.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(d.x, d.y, d.z));
}

// ---------- 旋转轴计算 ----------
function rotLocalAxesOfBlock(b) {
    const rx = varValue('v.xrot');
    const ry = varValue('v.yrot');
    const grx = varValue('v.rotatex');
    const gry = varValue('v.rotatey');
    const grz = varValue('v.rotatez');
    const globalRz = new THREE.Matrix4().makeRotationZ(degToRad(-grz));
    const globalRx = new THREE.Matrix4().makeRotationX(degToRad(grx));
    const globalRy = new THREE.Matrix4().makeRotationY(degToRad(-gry));
    const globalRot = globalRy.clone().multiply(globalRz).multiply(globalRx);
    const matRy = new THREE.Matrix4().makeRotationY(degToRad(-ry));
    const matRx = new THREE.Matrix4().makeRotationX(degToRad(rx));
    return {
        yAxis: new THREE.Vector3(0, 1, 0).applyMatrix4(globalRot).normalize(),
        xAxis: new THREE.Vector3(1, 0, 0).applyMatrix4(matRy).applyMatrix4(globalRot).normalize(),
        zAxis: new THREE.Vector3(0, 0, 1).applyMatrix4(matRx).applyMatrix4(matRy).applyMatrix4(globalRot).normalize()
    };
}

function rotDiscBasisFor(b, axis) {
    const a = rotLocalAxesOfBlock(b);
    if (axis === 'x') return orthonormalDiscBasis(a.xAxis, a.yAxis);
    if (axis === 'y') return orthonormalDiscBasis(a.yAxis, a.zAxis);
    return orthonormalDiscBasis(a.zAxis, a.xAxis);
}

function rotVisualAngle(axis, varName) {
    const v = varValue(varName);
    return axis === 'x' ? degToRad(v) : degToRad(-v);
}

function rotGizmoCenterLocal(b, mode) {
    return mode === 'center' ? centerOfBlock(b).sub(originOfBlock(b)) : new THREE.Vector3();
}

function rotGizmoCenterWorld(b, mode) {
    return mode === 'center' ? centerOfBlock(b) : originOfBlock(b);
}

// ---------- 数值标签（纹理） ----------
function makeLabelTexture(text, color = 0x111111) {
    const cvs = document.createElement('canvas');
    cvs.width = 512; cvs.height = 160;
    const ctx = cvs.getContext('2d');
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    const r = 26, x = 18, y = 24, w = 476, h = 112;
    ctx.fillStyle = 'rgba(255,255,255,.94)';
    ctx.strokeStyle = 'rgba(0,0,0,.72)'; ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.font = 'bold 44px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
    ctx.fillText(text, 256, 80);
    const tex = new THREE.CanvasTexture(cvs);
    tex.needsUpdate = true;
    return tex;
}

function makeEmbeddedLabel(varName, color, size = 1) {
    const text = `${varName.replace('v.', '')}=${varValue(varName).toFixed(4)}`;
    const label = new THREE.Mesh(
        new THREE.PlaneGeometry(1.22 * size, 0.38 * size),
        new THREE.MeshBasicMaterial({
            map: makeLabelTexture(text, color),
            transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide
        })
    );
    label.userData.herLabelVar = varName;
    label.renderOrder = 1000;
    return label;
}

// ---------- 创建箭头 ----------
function makeArrow(dir, planeNormal, color, varName, scale, offset = 0, opts = {}) {
    const group = new THREE.Group();
    const d = dir.clone().normalize();
    const vl = opts.visualScale || 1;
    const start = (opts.start || 0.55) + offset;
    const shaftLen = 1.8 * vl;
    const headLen = 0.28 * vl;
    const shaftR = 0.025 * vl;
    const isBase = opts.moveKind === 'base';
    if (isBase) {
        // 位移：分段细线（6段短圆柱 + 5个间隙）
        const segLen = shaftLen / 11;
        for (let i = 0; i < 6; i++) {
            const seg = new THREE.Mesh(
                new THREE.CylinderGeometry(shaftR, shaftR, segLen, 6),
                mat(color, 0.85)
            );
            const pos = start + (i * 2 + 0.5) * segLen;
            seg.position.copy(d.clone().multiplyScalar(pos));
            seg.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d);
            group.add(seg);
        }
        // 圆锥头
        const cone = new THREE.Mesh(
            new THREE.ConeGeometry(shaftR * 3.5, headLen, 8),
            mat(color, 0.9)
        );
        cone.position.copy(d.clone().multiplyScalar(start + shaftLen));
        cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d);
        group.add(cone);
    } else {
        // 枢轴：细圆柱杆 + 圆锥头
        const shaft = new THREE.Mesh(
            new THREE.CylinderGeometry(shaftR, shaftR, shaftLen, 6),
            mat(color, 0.9)
        );
        shaft.position.copy(d.clone().multiplyScalar(start + shaftLen * 0.5));
        shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d);
        group.add(shaft);
        const cone = new THREE.Mesh(
            new THREE.ConeGeometry(shaftR * 3.5, headLen, 8),
            mat(color, 0.95)
        );
        cone.position.copy(d.clone().multiplyScalar(start + shaftLen + headLen * 0.5));
        cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d);
        group.add(cone);
    }
    // 命中体
    const hitLen = 3.0 * vl;
    const hitRadius = Math.max(0.45 * vl, 0.40);
    const hit = new THREE.Mesh(
        new THREE.CylinderGeometry(hitRadius, hitRadius, hitLen, 24, 1, true), hitMat()
    );
    orientCylinderAlong(hit, d);
    hit.position.copy(d.clone().multiplyScalar(start + hitLen * 0.5));
    const pickMeta = {
        type: 'move', varName, scale, axis: d,
        planeNormal: planeNormal.clone().normalize(), color,
        visualLen: vl, start, priority: opts.priority || 0, hitLen, hitRadius,
        axisName: opts.axisName || (varName.includes('x') ? 'x' : (varName.includes('y') ? 'y' : 'z'))
    };
    // 如果指定了 mode（如 'base'），添加到拾取元数据
    if (opts.mode) pickMeta.mode = opts.mode;
    addPick(hit, pickMeta);
    group.add(hit);
    group.userData.herMoveKind = opts.moveKind || 'origin';
    group.userData.herMoveAxis = opts.axisName || (varName.includes('x') ? 'x' : (varName.includes('y') ? 'y' : 'z'));
    return group;
}

// ---------- 创建旋转弧 ----------
function makeArc(axis, color, varName, axisNormal, xBasis, yBasis, opts = {}) {
    const group = new THREE.Group();
    const plane = new THREE.Group();
    const radius = opts.radius || 2.05;
    const end = Math.PI; // 半圆弧
    const rotMode = opts.rotMode || 'origin';
    const arcGeom = makeArcBandShape(radius, 0.05, 0, end);
    const arc = new THREE.Mesh(arcGeom, mat(color, 0.85));
    const pgram = new THREE.Mesh(makeDiamondShape(0.22), mat(color, 0.95));
    pgram.position.set(Math.cos(end * 0.5) * radius, Math.sin(end * 0.5) * radius, 0);
    pgram.rotation.z = end * 0.5;
    const d0 = orthonormalDiscBasis(axisNormal.clone().normalize(), xBasis.clone().normalize());
    const rotMeta = {
        type: 'rot', varName, scale: 1, axis, rotMode,
        priority: opts.priority || 35,
        axisNormal: d0.z.clone(), xBasis: d0.x.clone(), yBasis: d0.y.clone(),
        radius, end
    };
    plane.add(arc); plane.add(pgram);
    const hitSphereGeom = new THREE.SphereGeometry(0.34, 14, 10);
    for (let i = 0; i <= 22; i++) {
        const a = end * i / 22;
        const p = new THREE.Mesh(hitSphereGeom, hitMat());
        p.position.set(Math.cos(a) * radius, Math.sin(a) * radius, 0);
        addPick(p, Object.assign({}, rotMeta));
        plane.add(p);
    }
    // 平行四边形上额外命中球
    const pgramHit = new THREE.Mesh(new THREE.SphereGeometry(0.48, 14, 10), hitMat());
    pgramHit.position.copy(pgram.position);
    addPick(pgramHit, Object.assign({}, rotMeta));
    plane.add(pgramHit);
    group.add(plane);
    group.userData.herRotAxis = axis;
    group.userData.herRotVar = varName;
    group.userData.herRotMode = rotMode;
    group.userData.herRotPlane = plane;
    if (opts.offset) group.position.copy(opts.offset);
    orientDiscToBasis(group, d0.x, d0.y, d0.z);
    // 预先计算摄像机朝向角，后续 updateRotGizmosLive 中保持固定
    const wc = new THREE.Vector3();
    group.getWorldPosition(wc);
    const cd = camera.position.clone().sub(wc).normalize();
    group.userData.herFaceAngle = Math.atan2(cd.dot(d0.y), cd.dot(d0.x));
    // 初始角度与 updateRotGizmosLive 一致（包含 faceAngle 补偿），避免首次渲染位置偏差
    plane.rotation.z = rotVisualAngle(axis, varName) + group.userData.herFaceAngle - Math.PI * 0.5;
    rotArcGroups.push(group);
    return group;
}

function makeOriginCenterLine(b) {
    const geom = new THREE.CylinderGeometry(0.045, 0.045, 1, 16, 1, true);

function updateOriginCenterLineLive(b = selected()) {
    if (!originCenterLineObj || !b) return;
    const center = centerOfBlock(b).sub(originOfBlock(b));

    originCenterLineObj.visible = len >= 1e-4;
    if (len < 1e-4) return;
    originCenterLineObj.position.copy(center.clone().multiplyScalar(0.5));
    originCenterLineObj.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), center.clone().normalize());

function makeScaleDots(b) {
    const group = new THREE.Group();
    const pts = [[-0.5,-0.5,-0.5],[0.5,-0.5,-0.5],[0.5,0.5,-0.5],[-0.5,0.5,-0.5],
                 [-0.5,-0.5,0.5],[0.5,-0.5,0.5],[0.5,0.5,0.5],[-0.5,0.5,0.5]];
    const s = Math.abs(b?.scope?.vars?.get('v.scale')?.value ?? 1);
    group.quaternion.copy(quatOfBlock(b));
    const dotGeom = new THREE.PlaneGeometry(0.18, 0.18);
    pts.forEach((p, i) => {
        const dot = new THREE.Mesh(dotGeom, mat(0xfff7a8));
        dot.position.set(p[0] * s, p[1] * s, p[2] * s);
        dot.lookAt(camera.position);
        group.add(dot);
        const hit = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 10), hitMat());
        hit.position.copy(dot.position);
        addPick(hit, { type: 'scale', varName: 'v.scale', scale: 0.012 });
        group.add(hit);
    });
    return group;
}

function makeAt(offset, child, opts = {}) {

}

                    g.position.copy(centerOfBlock(b).sub(originOfBlock(b)));

            const wx = new THREE.Vector3(1,0,0), wy = new THREE.Vector3(0,1,0), wz = new THREE.Vector3(0,0,1);

function setConstVarValue(b, varName, value) {
    let def = b.scope.vars.get(varName);
    if (!def) {
        const rg = getDefaultRange(varName);
        b.scope.addVar(varName, '0', rg.min, rg.max, rg.step);
        def = b.scope.vars.get(varName);
    }
    if (!def || !Number.isFinite(value)) return;
    if (['v.xrot','v.yrot','v.zrot'].includes(varName)) value = normRotDeg(value);
    const highPrecision = ['v.xpos','v.ypos','v.zpos','v.xbasepos','v.ybasepos','v.zbasepos'].includes(varName);
    const dec = highPrecision ? 4 : ((def.step && def.step.toString().includes('.')) ? Math.max(4, def.step.toString().split('.')[1].length) : 4);
    def.expr = String(parseFloat(value.toFixed(dec)));
    def.value = parseFloat(value.toFixed(dec));
}

function baseposDeltaToWorldMatrix(b) {
    const baseM = b.scope.toM().slice();
    const rotX = Number(b.scope.vars.get('v.rotatex')?.value ?? 0);
    const rotY = Number(b.scope.vars.get('v.rotatey')?.value ?? 0);
    const rotZ = Number(b.scope.vars.get('v.rotatez')?.value ?? 0);
    const pointForBase = (bx, by, bz) => {
        const M = baseM.slice();
        M[10] = bx; M[11] = by; M[12] = bz;
        return new THREE.Vector3(0,0,0).applyMatrix4(computeTransformMatrix(M, rotX, rotY, rotZ));
    };
    const bx = Number(b.scope.vars.get('v.xbasepos')?.value ?? 0);
    const by = Number(b.scope.vars.get('v.ybasepos')?.value ?? 0);
    const bz = Number(b.scope.vars.get('v.zbasepos')?.value ?? 0);
    const p0 = pointForBase(bx, by, bz);
    return new THREE.Matrix4().makeBasis(
        pointForBase(bx+1, by, bz).sub(p0),
        pointForBase(bx, by+1, bz).sub(p0),
        pointForBase(bx, by, bz+1).sub(p0)
    );
}

function compensateBaseposForFixedCenter(b, targetCenter) {
    b.refresh(); b.mesh.updateMatrixWorld(true);
    const curCenter = centerOfBlock(b);
    const fixWorld = targetCenter.clone().sub(curCenter);
    if (fixWorld.lengthSq() < 1e-14) return;
    const basis = baseposDeltaToWorldMatrix(b);
    if (Math.abs(basis.determinant()) < 1e-12) return;
    const deltaBase = fixWorld.applyMatrix4(basis.clone().invert());
    setConstVarValue(b, 'v.xbasepos', Number(b.scope.vars.get('v.xbasepos')?.value ?? 0) + deltaBase.x);
    setConstVarValue(b, 'v.ybasepos', Number(b.scope.vars.get('v.ybasepos')?.value ?? 0) + deltaBase.y);
    setConstVarValue(b, 'v.zbasepos', Number(b.scope.vars.get('v.zbasepos')?.value ?? 0) + deltaBase.z);
    b.refresh(); b.mesh.updateMatrixWorld(true);
}

function applyOriginRotateDelta(varName, delta) {

    for (const b of selectedBlocksSet) {
        const cur = Number(b.scope.vars.get(varName)?.value ?? 0);

        const cur = Number(b.scope.vars.get(varName)?.value ?? 0);
        setConstVarValue(b, varName, cur + delta);
        compensateBaseposForFixedCenter(b, beforeCenter);

    }
}

function changeVar(name, delta, refresh = true) {
    if (!selectedBlocksSet || !selectedBlocksSet.size) return;
    // 世界轴位移模式：将世界空间增量转换到局部 basepos 空间
    if (activePick && activePick.mode === 'base' && activePick.Ainv) {
        const worldDeltaVec = activePick.axis.clone().multiplyScalar(delta);
        const baseDeltaVec = worldDeltaVec.applyMatrix3(activePick.Ainv);
        for (const b of selectedBlocksSet) {
            ['xbasepos','ybasepos','zbasepos'].forEach((axis, i) => {
                const vn = 'v.' + axis;
                let def = b.scope.vars.get(vn);
                if (!def) {
                    const rg = getDefaultRange(vn);
                    b.scope.addVar(vn, '0', rg.min, rg.max, rg.step);
                    def = b.scope.vars.get(vn);
                }
                if (def) {
                    const cur = parseFloat(def.expr) || def.value;
                    const nv = cur + baseDeltaVec.getComponent(i);
                    // 拖拽时保留较高精度（6位小数），避免 toFixed(2) 丢失小增量导致大数值抖动
                    def.expr = nv.toFixed(6);
                    def.value = nv;
                }
            });
            b.refresh();
            b.mesh.updateMatrixWorld(true);
            syncKeyframeFromBlock(b);
        }
        recordAction();
    // 枢轴不联动模式：更新 xpos/ypos/zpos 后换算 basepos 保持模型在世界空间中的位置不变
    } else if (!pivotLinkModel && activePick && activePick.w0 && activePick.Ainv && herModes.has('origin') && activePick.type === 'move' && !name.includes('basepos')) {
        for (const b of selectedBlocksSet) {
            // 1. 先更新枢轴变量 (xpos/ypos/zpos)
            const d = b.scope.vars.get(name);
            if (!d) continue;
            let nv = (parseFloat(d.expr) || d.value) + delta;
            const dec = (d.step.toString().includes('.') ? d.step.toString().split('.')[1].length : 0);
            nv = parseFloat(nv.toFixed(dec));
            d.expr = nv.toString();
            d.value = nv;

            // 2. 获取更新后的位置 pos_new
            const posNew = new THREE.Vector3(
                Number(b.scope.vars.get('v.xpos')?.value ?? 0),
                Number(b.scope.vars.get('v.ypos')?.value ?? 0),
                Number(b.scope.vars.get('v.zpos')?.value ?? 0)
            );

            // 3. 核心公式：basepos_new = A⁻¹ · (w₀ - pos_new)
            const diff = activePick.w0.clone().sub(posNew);
            const baseNew = diff.applyMatrix3(activePick.Ainv);

            // 4. 写回 xbasepos / ybasepos / zbasepos
            ['xbasepos','ybasepos','zbasepos'].forEach((axis, i) => {
                const bn = 'v.' + axis;
                const bd = b.scope.vars.get(bn);
                if (bd) {
                    const val = baseNew.getComponent(i);
                    bd.expr = val.toString();
                    bd.value = val;
                }
            });

            b.refresh();
            b.mesh.updateMatrixWorld(true);
            syncKeyframeFromBlock(b);
        }
        recordAction();
    } else {
        applyBatchDelta(name, delta);
    }
    updateOriginCenterLineLive(selectedBlock);
    renderVariablesForBlock(selectedBlock);
    // 非拖拽时同步关键帧
    if (!draggingGizmo && selectedBlock) {
        syncKeyframeFromBlock(selectedBlock);
    }
    if (refresh && !draggingGizmo) {
        requestGizmoRefresh(); updateToolbar(true);
    } else {
        const isRotDrag = activePick && activePick.type === 'rot';
        dragNeedsRebuild = !isRotDrag;
        const now = performance.now();
        if (!isRotDrag && activePick && now - lastDragRebuild > 16) {
            lastDragRebuild = now; requestGizmoRefresh(); updateToolbar(true);
            refreshActivePickMeta(lastPX, lastPY);
        }
    }
}

function setVarDirect(varName, value) {

// ---------- 屏幕坐标辅助 ----------
function screenAxis(meta) {
    const rect = renderer.domElement.getBoundingClientRect();
    const c = gizmoRoot.position.clone();
    const p1 = c.clone().project(camera);
    const p2 = c.clone().add(meta.axis.clone().normalize()).project(camera);
    const sx = (p2.x - p1.x) * rect.width * 0.5;
    const sy = -(p2.y - p1.y) * rect.height * 0.5;
    const len = Math.hypot(sx, sy) || 1;
    return { x: sx / len, y: sy / len };
}

function screenAngleFor(meta, clientX, clientY) {
    const rect = renderer.domElement.getBoundingClientRect();
    const center = rotGizmoCenterWorld(selected(), meta.rotMode);
    const normal = meta.axisNormal?.clone().normalize() || new THREE.Vector3(0,0,1);
    const viewDir = camera.position.clone().sub(center).normalize();
    const xb = meta.xBasis?.clone().normalize() || new THREE.Vector3(1,0,0);
    const yb = meta.yBasis?.clone().normalize() || new THREE.Vector3(0,1,0);
    const screenFallback = () => {
        const c = center.clone().project(camera);
        const cx = (c.x * 0.5 + 0.5) * rect.width + rect.left;
        const cy = (-c.y * 0.5 + 0.5) * rect.height + rect.top;
        const px = center.clone().add(xb).project(camera);
        const py = center.clone().add(yb).project(camera);
        const ux = { x: (px.x - c.x) * rect.width * 0.5, y: -(px.y - c.y) * rect.height * 0.5 };
        const uy = { x: (py.x - c.x) * rect.width * 0.5, y: -(py.y - c.y) * rect.height * 0.5 };
        const vx = clientX - cx, vy = clientY - cy;
        return Math.atan2(vx * uy.x + vy * uy.y, vx * ux.x + vy * ux.y);
    };
    if (Math.abs(normal.dot(viewDir)) < 0.18) return screenFallback();
    const ndc = new THREE.Vector2(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(ndc, camera);
    const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, center);
    const hit = new THREE.Vector3();
    if (!raycaster.ray.intersectPlane(plane, hit)) return screenFallback();
    const v = hit.sub(center);
    if (v.lengthSq() < 1e-6) return screenFallback();
    return Math.atan2(v.dot(yb), v.dot(xb));
}

function screenTangentDelta(meta, clientX, clientY, dx, dy) {
    const rect = renderer.domElement.getBoundingClientRect();
    const center = rotGizmoCenterWorld(selected(), meta.rotMode);
    const c = center.clone().project(camera);
    const cx = (c.x * 0.5 + 0.5) * rect.width + rect.left;
    const cy = (-c.y * 0.5 + 0.5) * rect.height + rect.top;

        const px = center.clone().add(xb).project(camera);
        tx = (px.x - c.x) * rect.width * 0.5;
        ty = -(px.y - c.y) * rect.height * 0.5;
        const tl = Math.hypot(tx, ty) || 1;
        tx /= tl; ty /= tl; r = 90;
    }
    const tangentPx = dx * tx + dy * ty;
    const xb = meta.xBasis?.clone().normalize() || new THREE.Vector3(1,0,0);
    const yb = meta.yBasis?.clone().normalize() || new THREE.Vector3(0,1,0);
    const radius = Number(meta.radius || 2.05);
    const px = center.clone().addScaledVector(xb, radius).project(camera);
    const py = center.clone().addScaledVector(yb, radius).project(camera);
    const lx = Math.hypot((px.x - c.x) * rect.width * 0.5, (px.y - c.y) * rect.height * 0.5);
    const ly = Math.hypot((py.x - c.x) * rect.width * 0.5, (py.y - c.y) * rect.height * 0.5);
    const screenRadius = Math.max(48, Math.min(260, (lx + ly) * 0.5 || r || 90));
    let da = tangentPx / screenRadius;
    if (!Number.isFinite(da) || Math.abs(da) < 1e-6) {

}

// 轴线与网格
let axisGroup = null;
let showAxes = true, showGrid = true, showTicks = true;
let lastDistance = 0;
function createDynamicAxesAndGrid(camDist) {
    if (axisGroup) {
        axisGroup.traverse(c => { if (c.isCSS2DObject && c.element) c.element.remove(); });
        scene.remove(axisGroup);
    }
    axisGroup = new THREE.Group();
    let maxLen = Math.min(200, Math.max(5, camDist * 1.5));
    let step = 1;
    const targetSteps = [0.5, 1, 2, 5, 10, 20, 50];
    for (let s of targetSteps) if (maxLen / s <= 16 && maxLen / s >= 6) { step = s; break; }
    const actualMax = Math.floor(maxLen / step) * step;
    const ticks = [];
    for (let v = -actualMax; v <= actualMax + 0.001; v += step) if (Math.abs(v) > 0.01) ticks.push(v);
    const axes = [
        { start: new THREE.Vector3(-actualMax,0,0), end: new THREE.Vector3(actualMax,0,0), label:'X', color:0xff6666 },
        { start: new THREE.Vector3(0,-actualMax,0), end: new THREE.Vector3(0,actualMax,0), label:'Y', color:0x66ff66 },
        { start: new THREE.Vector3(0,0,-actualMax), end: new THREE.Vector3(0,0,actualMax), label:'Z', color:0x66aaff }
    ];
    const isMobile = window.innerWidth <= 700;
    const fontSize = isMobile ? '9px' : '12px';
    const textColor = document.body.classList.contains('light-mode') ? '#0f172a' : '#e2e8f0';
    axes.forEach(axis => {
        if (showAxes) {
            const points = [axis.start, axis.end];
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: axis.color }));
            axisGroup.add(line);
            const dir = new THREE.Vector3().subVectors(axis.end, axis.start).normalize();
            const arrow = new THREE.ArrowHelper(dir, axis.end, 0.4, axis.color, 0.2, 0.1);
            axisGroup.add(arrow);
        }
        if (showTicks) {
            ticks.forEach(val => {
                let pos = axis.label === 'X' ? new THREE.Vector3(val,0,0) : axis.label === 'Y' ? new THREE.Vector3(0,val,0) : new THREE.Vector3(0,0,val);
                let tickDir = axis.label === 'X' ? new THREE.Vector3(0,0.1,0.1) : axis.label === 'Y' ? new THREE.Vector3(0.1,0,0.1) : new THREE.Vector3(0.1,0.1,0);
                const tickGeo = new THREE.BufferGeometry().setFromPoints([pos, pos.clone().add(tickDir)]);
                const tickLine = new THREE.Line(tickGeo, new THREE.LineBasicMaterial({ color: 0x88aaff }));
                axisGroup.add(tickLine);
                const div = document.createElement('div');
                div.textContent = val.toFixed(1);
                div.style.cssText = `color:${textColor};font-size:${fontSize};font-weight:bold;text-shadow:0 0 2px rgba(0,0,0,0.3);padding:0 2px;white-space:nowrap;`;
                const labelObj = new CSS2DObject(div);
                labelObj.position.copy(pos);
                axisGroup.add(labelObj);
            });
        }
    });
    if (showGrid) {
        const gridSize = actualMax * 2;
        const divisions = ticks.length * 2;
        const gridStep = gridSize / divisions;
        for (let i = -divisions/2; i <= divisions/2; i++) {
            const pos = i * gridStep;
            if (Math.abs(pos) > actualMax) continue;
            const pointsX = [new THREE.Vector3(-actualMax,0,pos), new THREE.Vector3(actualMax,0,pos)];
            const geoX = new THREE.BufferGeometry().setFromPoints(pointsX);
            const lineX = new THREE.Line(geoX, new THREE.LineBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.35 }));
            axisGroup.add(lineX);
            const pointsZ = [new THREE.Vector3(pos,0,-actualMax), new THREE.Vector3(pos,0,actualMax)];
            const geoZ = new THREE.BufferGeometry().setFromPoints(pointsZ);
            const lineZ = new THREE.Line(geoZ, new THREE.LineBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.35 }));
            axisGroup.add(lineZ);
        }
    }
    scene.add(axisGroup);
}
function updateAxesByDistance(force = false) {
    const dist = camera.position.length();
    if (force || Math.abs(dist - lastDistance) > 0.5) {
        lastDistance = dist;
        createDynamicAxesAndGrid(dist);
    }
}

// 射线检测与点击选择
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let clickTimer = null; 
function onCanvasClick(event) {
    if (event.target.closest('.data-panel') || event.target.closest('.top-bar') || event.target.closest('.new-top-bar') || event.target.closest('.side-block-list')) return;
    if (draggingGizmo || pendingInputPick) return;
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    blocks.forEach(b => { if (b.mesh) b.mesh.updateMatrixWorld(true); });
    const allMeshes = blocks.flatMap(b => b.getMeshes());
    const hits = raycaster.intersectObjects(allMeshes);
    if (hits.length) {
        const hit = hits[0].object;
        const block = blocks.find(b => b.getMeshes().includes(hit));
        if (block) {
            const isMulti = event.ctrlKey || event.metaKey || event.shiftKey;
            if (isMulti) {
                // 多选（Ctrl/Shift+点击）立即执行，跳过双击检测延迟
                if (clickTimer !== null) {
                    clearTimeout(clickTimer);
                    clickTimer = null;
                }
                toggleBlockSelection(block, true);
                // 多选时不改变关键帧面板选中状态
            } else if (clickTimer !== null) {
                // 第二次点击（双击）
                toggleBlockSelection(block, true);
                clearTimeout(clickTimer);
                clickTimer = null;
                // 同步关键帧面板
                if (keyframeWindowOpen && keyframeData.has(block.id)) {
                    selectKeyframeBlock(block.id);
                }
            } else {
                clickTimer = setTimeout(() => {
                    toggleBlockSelection(block, false);
                    clickTimer = null;
                    // 同步关键帧面板
                    if (keyframeWindowOpen && keyframeData.has(block.id)) {
                        selectKeyframeBlock(block.id);
                    }
                }, 200);
            }
        }
    } else if (!event.ctrlKey && !isNewLayoutMode) {
        if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
        selectedBlocksSet.clear();
        selectBlock(null);
        renderVariablesForBlock(null);
        updateDropdownSelection();
    }
}
renderer.domElement.addEventListener('click', onCanvasClick);
renderer.domElement.addEventListener('touchstart', e => {
    if (e.target.closest('.new-top-bar') || e.target.closest('.side-block-list')) return;
    let start = { x: e.touches[0].clientX, y: e.touches[0].clientY }, moved = false;
    const onMove = me => {
        if (Math.abs(me.touches[0].clientX - start.x) > 5 || Math.abs(me.touches[0].clientY - start.y) > 5) moved = true;
    };
    const onEnd = ee => {
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onEnd);
        if (!moved && !ee.target.closest('.data-panel') && !ee.target.closest('.top-bar') && !ee.target.closest('.new-top-bar') && !ee.target.closest('.side-block-list')) {
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((ee.changedTouches[0].clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((ee.changedTouches[0].clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            blocks.forEach(b => { if (b.mesh) b.mesh.updateMatrixWorld(true); });
            const allMeshes = blocks.flatMap(b => b.getMeshes());
            const hits = raycaster.intersectObjects(allMeshes);
            if (hits.length) {
                const hitBlock = blocks.find(b => b.getMeshes().includes(hits[0].object));

// 动画循环
function animate() {
    requestAnimationFrame(animate);
    controls.update();

    // ---------- 主光跟随摄像机（提供摄像机视角方向的照明），补光固定在世界空间 ----------
    const camDir = new THREE.Vector3();

    }

}

// ==================== 欧拉角转换（rotate → rot）====================
// 将选中方块的 rotatex/rotatey/rotatez 合并到 xrot/yrot/zrot 中并删除 rotate 变量
function eulerAngleConvertBlock(block) {
    const vars = block.scope.vars;
    const hasRotate = vars.has('v.rotatex') || vars.has('v.rotatey') || vars.has('v.rotatez');
    if (!hasRotate) return false;

    const rotatex = vars.get('v.rotatex')?.value ?? 0;
    const rotatey = vars.get('v.rotatey')?.value ?? 0;
    const rotatez = vars.get('v.rotatez')?.value ?? 0;
    const xrot = vars.get('v.xrot')?.value ?? 0;
    const yrot = vars.get('v.yrot')?.value ?? 0;
    const zrot = vars.get('v.zrot')?.value ?? 0;

    const d2r = d => d * Math.PI / 180;
    const r2d = r => r * 180 / Math.PI;
    const Rx = r => [1,0,0, 0,Math.cos(r),-Math.sin(r), 0,Math.sin(r),Math.cos(r)];
    const Ry = r => [Math.cos(r),0,Math.sin(r), 0,1,0, -Math.sin(r),0,Math.cos(r)];
    const Rz = r => [Math.cos(r),-Math.sin(r),0, Math.sin(r),Math.cos(r),0, 0,0,1];
    const mMul = (A,B) => {
        const C = new Array(9);
        for (let i=0;i<3;i++) for (let j=0;j<3;j++) { let s=0; for(let k=0;k<3;k++) s+=A[i*3+k]*B[k*3+j]; C[i*3+j]=s; }
        return C;
    };

    let R = Ry(d2r(-rotatey));
    R = mMul(R, Rx(d2r(rotatex)));
    R = mMul(R, Rz(d2r(-rotatez)));
    R = mMul(R, Ry(d2r(-yrot)));
    R = mMul(R, Rx(d2r(xrot)));
    R = mMul(R, Rz(d2r(-zrot)));

    const sb = -R[1*3+2];
    const cb = Math.sqrt(Math.max(0, 1 - sb*sb));
    let newXrot, newYrot, newZrot;
    if (Math.abs(cb) < 1e-12) {
        newXrot = r2d(Math.asin(sb));
        newYrot = 0;
        newZrot = 0;
    } else {
        const b = Math.asin(sb);
        const c = Math.atan2(R[1*3+0]/cb, R[1*3+1]/cb);
        const a = Math.atan2(R[0*3+2]/cb, R[2*3+2]/cb);
        newXrot = r2d(b);
        newYrot = -r2d(a);
        newZrot = -r2d(c);
    }

    const setVal = (name, val) => {
        const d = vars.get(name);
        if (d) {
            const rounded = Math.round(val * 10000) / 10000;
            d.expr = String(rounded);
            d.value = rounded;
        }
    };
    setVal('v.xrot', newXrot);
    setVal('v.yrot', newYrot);
    setVal('v.zrot', newZrot);

    vars.delete('v.rotatex');
    vars.delete('v.rotatey');
    vars.delete('v.rotatez');

    return true;
}

// 关键帧模式下：换算选中帧的方块关键帧数据的 rotate 变量
function eulerAngleConvertKeyframe(blockId, time) {
    if (!keyframeData.has(blockId)) return false;
    const data = keyframeData.get(blockId);
    if (data.frames.size === 0) return false;

    const interpolated = interpolateKeyframes(blockId, time);
    if (!interpolated) return false;

    const hasRotate = ('rotatex' in interpolated) || ('rotatey' in interpolated) || ('rotatez' in interpolated);
    if (!hasRotate) return false;

    const rotatex = interpolated['rotatex'] ?? 0;
    const rotatey = interpolated['rotatey'] ?? 0;
    const rotatez = interpolated['rotatez'] ?? 0;
    const xrot = interpolated['xrot'] ?? 0;
    const yrot = interpolated['yrot'] ?? 0;
    const zrot = interpolated['zrot'] ?? 0;

    const d2r = d => d * Math.PI / 180;
    const r2d = r => r * 180 / Math.PI;
    const Rx = r => [1,0,0, 0,Math.cos(r),-Math.sin(r), 0,Math.sin(r),Math.cos(r)];
    const Ry = r => [Math.cos(r),0,Math.sin(r), 0,1,0, -Math.sin(r),0,Math.cos(r)];
    const Rz = r => [Math.cos(r),-Math.sin(r),0, Math.sin(r),Math.cos(r),0, 0,0,1];
    const mMul = (A,B) => {
        const C = new Array(9);
        for (let i=0;i<3;i++) for (let j=0;j<3;j++) { let s=0; for(let k=0;k<3;k++) s+=A[i*3+k]*B[k*3+j]; C[i*3+j]=s; }
        return C;
    };

    let R = Ry(d2r(-rotatey));
    R = mMul(R, Rx(d2r(rotatex)));
    R = mMul(R, Rz(d2r(-rotatez)));
    R = mMul(R, Ry(d2r(-yrot)));
    R = mMul(R, Rx(d2r(xrot)));
    R = mMul(R, Rz(d2r(-zrot)));

    const sb = -R[1*3+2];
    const cb = Math.sqrt(Math.max(0, 1 - sb*sb));
    let newXrot, newYrot, newZrot;
    if (Math.abs(cb) < 1e-12) {
        newXrot = r2d(Math.asin(sb));
        newYrot = 0;
        newZrot = 0;
    } else {
        const b = Math.asin(sb);
        const c = Math.atan2(R[1*3+0]/cb, R[1*3+1]/cb);
        const a = Math.atan2(R[0*3+2]/cb, R[2*3+2]/cb);
        newXrot = r2d(b);
        newYrot = -r2d(a);
        newZrot = -r2d(c);
    }

    const round4 = v => Math.round(v * 10000) / 10000;

    // 更新所有关键帧：删除 rotate 变量，更新 rot 值
    for (const [, frameMap] of data.frames) {
        frameMap.delete('rotatex');
        frameMap.delete('rotatey');
        frameMap.delete('rotatez');
        frameMap.set('xrot', round4(newXrot));
        frameMap.set('yrot', round4(newYrot));
        frameMap.set('zrot', round4(newZrot));
    }

    return true;
}

// 通用欧拉角转换入口（处理选中方块）
function applyEulerAngleConversion() {
    const isKfActive = isNewLayoutMode && isKeyframeMode && keyframeWindowOpen && selectedKeyframeBlock;
    let blocksToConvert = [];
    let converted = 0, noRotate = 0;

    if (isKfActive) {
        const bid = selectedKeyframeBlock;
        const block = blocks.find(b => b.id === bid);
        if (!block) { showModal("提示", "未选中动画方块", null, false); return; }
        const data = keyframeData.get(bid);
        let hasRotInKeyframes = false;
        if (data) {
            for (const [, frameMap] of data.frames) {
                if (frameMap.has('rotatex') || frameMap.has('rotatey') || frameMap.has('rotatez')) {
                    hasRotInKeyframes = true;
                    break;
                }
            }
        }
        if (!hasRotInKeyframes) {
            showModal("转换结果", `方块 "${bid}" 无 rotate 变量`, null, false);
            return;
        }
        const success = eulerAngleConvertKeyframe(bid, keyframeCurrentTime);
        if (success) {
            applyKeyframeToBlock(bid, keyframeCurrentTime);
            block.refresh();
            renderKeyframeDataPanel();
            converted = 1;
        } else {
            noRotate = 1;
        }
    } else {
        blocksToConvert = selectedBlocksSet.size ? Array.from(selectedBlocksSet) : (selectedBlock ? [selectedBlock] : []);
        if (blocksToConvert.length === 0) {
            showModal("提示", "请先选中一个方块", null, false);
            return;
        }
        for (const block of blocksToConvert) {
            if (eulerAngleConvertBlock(block)) {
                block.refresh();
                converted++;
            } else {
                noRotate++;
            }
        }
    }

    if (converted > 0) {
        recordAction();
        if (selectedBlock) renderVariablesForBlock(selectedBlock);
        if (isNewLayoutMode) renderSideBlockList();
        showModal("转换完成", `成功转换 ${converted} 个方块${noRotate > 0 ? `，${noRotate} 个方块无 rotate 变量` : ''}`, null, false);
    } else {
        showModal("转换结果", `选中方块无 rotate 变量${noRotate > 0 ? `（共 ${noRotate} 个）` : ''}`, null, false);
    }
}

// 获取方块的动画标识符
function getKeyframeAnimId(blockId) {
    return blockId + '_anim';
}

// 检查方块是否有关键帧动画
function hasKeyframeAnimation(blockId) {
    return keyframeData.has(blockId) && keyframeData.get(blockId).frames.size > 0;
}

// 获取关键帧时间列表（排序后）
function getKeyframeTimes(blockId) {
    const data = keyframeData.get(blockId);
    if (!data) return [];
    return Array.from(data.frames.keys()).sort((a, b) => a - b);
}

// 在两个关键帧之间插值
function interpolateKeyframes(blockId, time) {
    const data = keyframeData.get(blockId);
    if (!data || data.frames.size === 0) return null;
    const times = getKeyframeTimes(blockId);
    if (times.length === 0) return null;
    
    // 精确匹配
    if (data.frames.has(time)) {
        const result = {};
        for (const [k, v] of data.frames.get(time)) {
            result[k] = v;
        }
        return result;
    }
    
    // 边界情况
    if (time <= times[0]) {
        const result = {};
        for (const [k, v] of data.frames.get(times[0])) {
            result[k] = v;
        }
        return result;
    }
    if (time >= times[times.length - 1]) {
        const result = {};
        for (const [k, v] of data.frames.get(times[times.length - 1])) {
            result[k] = v;
        }
        return result;
    }
    
    // 找到前后关键帧
    let prevTime = times[0], nextTime = times[times.length - 1];
    for (let i = 0; i < times.length - 1; i++) {
        if (time >= times[i] && time <= times[i + 1]) {
            prevTime = times[i];
            nextTime = times[i + 1];
            break;
        }
    }
    
    const t = (time - prevTime) / (nextTime - prevTime);
    const prevData = data.frames.get(prevTime);
    const nextData = data.frames.get(nextTime);
    
    const result = {};
    const allKeys = new Set([...prevData.keys(), ...nextData.keys()]);
    for (const key of allKeys) {
        const prevVal = prevData.has(key) ? prevData.get(key) : 0;
        const nextVal = nextData.has(key) ? nextData.get(key) : 0;
        result[key] = prevVal + (nextVal - prevVal) * t;
    }
    return result;
}

// 应用关键帧到方块
function applyKeyframeToBlock(blockId, time) {
    const block = blocks.find(b => b.id === blockId);
    if (!block) return;
    const interpolated = interpolateKeyframes(blockId, time);
    if (!interpolated) return;
    
    const varNameMap = {
        'xpos': 'v.xpos', 'ypos': 'v.ypos', 'zpos': 'v.zpos',
        'xrot': 'v.xrot', 'yrot': 'v.yrot', 'zrot': 'v.zrot',
        'rotatex': 'v.rotatex', 'rotatey': 'v.rotatey', 'rotatez': 'v.rotatez',
        'scale': 'v.scale', 'extend_scale': 'v.extend_scale',
        'extend_xrot': 'v.extend_xrot', 'extend_yrot': 'v.extend_yrot',
        'xbasepos': 'v.xbasepos', 'ybasepos': 'v.ybasepos', 'zbasepos': 'v.zbasepos'
    };
    
    for (const [shortName, value] of Object.entries(interpolated)) {
        const fullName = varNameMap[shortName] || `v.${shortName}`;
        if (block.scope.vars.has(fullName)) {
            const d = block.scope.vars.get(fullName);
            d.expr = value.toString();
            d.value = value;
        } else {
            block.scope.addVar(fullName, value.toString(), -100, 100, 0.01);
            const d = block.scope.vars.get(fullName);
            if (d) d.value = value;
        }
    }
    block.refresh();
}
